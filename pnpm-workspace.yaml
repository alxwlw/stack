packages:
  - packages/*

# stack depends on repo-rules at its exact version: without this pnpm resolves it from the registry, which fails on a release branch.
linkWorkspacePackages: true

catalogs:
  dev:
    dependency-cruiser: 18.8.0
    knip: 6.45.1
    typescript: 7.1.0-beta
    oxlint: 1.94.0
    oxlint-tsgolint: 7.0.2007
    oxfmt: 0.79.0
    '@types/bun': 1.4.4
    '@types/node': 26.6.6
