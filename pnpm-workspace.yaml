packages:
  - packages/*

# stack depends on repo-rules at its exact version: without this pnpm resolves it from the registry, which fails on a release branch.
linkWorkspacePackages: true

catalogs:
  dev:
    dependency-cruiser: 18.9.0
    knip: 6.48.0
    typescript: 7.1.0-beta
    oxlint: 1.95.0
    oxlint-tsgolint: 7.0.2008
    oxfmt: 0.80.0
    '@types/bun': 1.4.5
    '@types/node': 26.6.6
