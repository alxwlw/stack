name: setup
description: >-
  proto-тулчейн по .prototools; по желанию — токен приватного npm-реестра в npmrc джоба (NPM_CONFIG_USERCONFIG) и
  pnpm install
inputs:
  install:
    description: запускать ли pnpm install --frozen-lockfile
    default: 'true'
  working-directory:
    description: рабочий каталог
    default: '.'
  registry:
    description: хост приватного npm-реестра без схемы (npm.pkg.github.com); пусто — не настраивать
    default: ''
  registry-token-var:
    description: >-
      ИМЯ env-переменной джобы с токеном реестра. Пусто при непустом registry — берётся
      STACK_REGISTRY_TOKEN; без registry — ошибка. В npmrc джоба пишется ссылка ${ИМЯ}, не значение:
      pnpm >= 11.15 игнорирует env-креды в закоммиченном проектном .npmrc.
    default: ''
runs:
  using: composite
  steps:
    - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
      with:
        auto-install: true
    - name: токен реестра в npmrc джоба
      if: inputs.registry != '' || inputs.registry-token-var != ''
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        TOKEN_VAR: ${{ inputs.registry-token-var }}
        DEFAULT_TOKEN_VAR: STACK_REGISTRY_TOKEN
      run: |
        if [ -z "$REGISTRY" ]; then
          echo "::error::registry-token-var задаётся только вместе с registry"
          exit 1
        fi
        TOKEN_VAR="${TOKEN_VAR:-$DEFAULT_TOKEN_VAR}"
        if ! [[ "$TOKEN_VAR" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
          echo "::error::registry-token-var — имя переменной окружения, получено: $TOKEN_VAR"
          exit 1
        fi
        if ! [[ "$REGISTRY" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~-]+)*$ ]]; then
          echo "::error::registry — хост без схемы и завершающего /, получено: $REGISTRY"
          exit 1
        fi
        key="//${REGISTRY}/:_authToken="
        line="${key}\${${TOKEN_VAR}}"
        # Общий ~/.npmrc не трогаем: на self-hosted раннере он живёт между джобами всех репозиториев, и
        # строка того же ключа от другого джоба перебивала бы эту — pnpm берёт последнюю (DP-662, DX-211).
        # Свой файл на джоб: прежний user-level конфиг без строк этого ключа плюс своя строка.
        base="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
        own="${RUNNER_TEMP:?RUNNER_TEMP не задан}/stack-setup.npmrc"
        tmp="$(mktemp "$own.XXXXXX")"
        if [ -f "$base" ]; then
          awk -v key="$key" '{ l = $0; gsub(/[ \t]/, "", l); if (index(l, key) != 1) print }' "$base" > "$tmp"
        fi
        echo "$line" >> "$tmp"
        mv -f "$tmp" "$own"
        echo "NPM_CONFIG_USERCONFIG=$own" >> "$GITHUB_ENV"
    - name: пути к actionlint и shellcheck
      shell: bash
      run: |
        # proto-шимы этих двух гоняются при параллельном запуске за общий временный файл плагина —
        # CI зовёт реальные бинарники по путям. Инструмента нет в .prototools — переменной нет.
        for tool in actionlint shellcheck; do
          if grep -qE "^${tool}[[:space:]]*=" .prototools 2>/dev/null && bin="$(proto bin "$tool" 2>/dev/null)"; then
            echo "${tool^^}_BIN=$bin" >> "$GITHUB_ENV"
          fi
        done
    - if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
