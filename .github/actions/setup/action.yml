name: setup
description: proto-тулчейн по .prototools и, по желанию, установка зависимостей pnpm
inputs:
  install:
    description: запускать ли pnpm install --frozen-lockfile
    default: 'true'
  working-directory:
    description: рабочий каталог
    default: '.'
runs:
  using: composite
  steps:
    - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
      with:
        auto-install: true
    - if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
