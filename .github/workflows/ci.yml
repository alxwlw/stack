name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun test
      - run: pnpm exec oxlint --type-aware
      - run: pnpm exec oxfmt --check .
      - run: pnpm exec tsc --build
      - run: proto run actionlint -- -color
      - name: конфиги Renovate валидны
        run: npx --yes --package renovate@44.147.0 -- renovate-config-validator --strict renovate.json5 renovate/canon.json5 packages/stack/canon/files/renovate.template.json5

  setup-action:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    env:
      TEST_TOKEN: not-a-real-token
      STACK_REGISTRY_TOKEN: not-a-real-token
    steps:
      - uses: actions/checkout@v7
      - name: снимок общего ~/.npmrc до setup
        run: |
          if [ -f "$HOME/.npmrc" ]; then sha256sum < "$HOME/.npmrc"; else echo absent; fi > "$RUNNER_TEMP/home-npmrc.before"
      - uses: ./.github/actions/setup
        with:
          install: false
          registry: npm.pkg.github.com
          registry-token-var: TEST_TOKEN
      - name: в npmrc джоба ссылка на переменную, а не её значение
        run: |
          # Файл джоба лежит в RUNNER_TEMP, общий ~/.npmrc раннера не пишется (DX-211).
          case "$NPM_CONFIG_USERCONFIG" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          # shellcheck disable=SC2016 # ${TEST_TOKEN} должен остаться литералом
          grep -qxF '//npm.pkg.github.com/:_authToken=${TEST_TOKEN}' "$NPM_CONFIG_USERCONFIG"
          if grep -qF 'not-a-real-token' "$NPM_CONFIG_USERCONFIG"; then exit 1; fi
          # умолчание не вмешалось: строка с токеном одна
          test "$(grep -c '^//npm.pkg.github.com/:_authToken=' "$NPM_CONFIG_USERCONFIG")" = 1
      - name: пути к бинарникам экспортированы
        run: test -x "$ACTIONLINT_BIN" && test -x "$SHELLCHECK_BIN" && test -x "$GITLEAKS_BIN" && test -x "$HADOLINT_BIN"
      - name: повторный вызов
        uses: ./.github/actions/setup
        with:
          install: false
          registry: npm.pkg.github.com
          registry-token-var: TEST_TOKEN
      - name: строка не задублировалась
        run: |
          # shellcheck disable=SC2016
          test "$(grep -cxF '//npm.pkg.github.com/:_authToken=${TEST_TOKEN}' "$NPM_CONFIG_USERCONFIG")" = 1
      - name: только registry — умолчание имени переменной
        uses: ./.github/actions/setup
        with:
          install: false
          registry: npm.example.com
      - name: повторный вызов только с registry
        uses: ./.github/actions/setup
        with:
          install: false
          registry: npm.example.com
      - name: в npmrc джоба ссылка на STACK_REGISTRY_TOKEN, одна строка, значения нет; ~/.npmrc прежний
        run: |
          # shellcheck disable=SC2016 # ${STACK_REGISTRY_TOKEN} должен остаться литералом
          grep -qxF '//npm.example.com/:_authToken=${STACK_REGISTRY_TOKEN}' "$NPM_CONFIG_USERCONFIG"
          # shellcheck disable=SC2016
          test "$(grep -cxF '//npm.example.com/:_authToken=${STACK_REGISTRY_TOKEN}' "$NPM_CONFIG_USERCONFIG")" = 1
          # первый реестр пережил вызовы со вторым
          # shellcheck disable=SC2016
          test "$(grep -cxF '//npm.pkg.github.com/:_authToken=${TEST_TOKEN}' "$NPM_CONFIG_USERCONFIG")" = 1
          if grep -qF 'not-a-real-token' "$NPM_CONFIG_USERCONFIG"; then exit 1; fi
          if [ -f "$HOME/.npmrc" ]; then sha256sum < "$HOME/.npmrc"; else echo absent; fi | cmp - "$RUNNER_TEMP/home-npmrc.before"
      - id: bad-var
        continue-on-error: true
        uses: ./.github/actions/setup
        with:
          install: false
          registry: npm.pkg.github.com
          registry-token-var: 'X; touch /tmp/pwned'
      - id: var-only
        continue-on-error: true
        uses: ./.github/actions/setup
        with:
          install: false
          registry-token-var: TEST_TOKEN
      - name: неверные входы отклонены, инъекции не было
        env:
          BAD_VAR: ${{ steps.bad-var.outcome }}
          VAR_ONLY: ${{ steps.var-only.outcome }}
        run: |
          test "$BAD_VAR" = failure
          test "$VAR_ONLY" = failure
          test ! -e /tmp/pwned

  setup-action-bare:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: .prototools ещё не на каноне — без пинов guardrails
        run: sed -i -E '/^(actionlint|shellcheck|gitleaks|hadolint)[[:space:]]*=/d' .prototools
      - uses: ./.github/actions/setup
        with:
          install: false
      - name: action не упал и ничего не экспортировал
        run: test -z "${ACTIONLINT_BIN:-}" && test -z "${SHELLCHECK_BIN:-}" && test -z "${GITLEAKS_BIN:-}" && test -z "${HADOLINT_BIN:-}"
