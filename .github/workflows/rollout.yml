name: rollout
on:
  workflow_run:
    workflows: [publish]
    types: [completed]
# Токен берёт только actions/checkout — contents: read; рассылка идёт токенами приложения.
permissions:
  contents: read
# Группа на тег релиза: общая группа отменила бы ждущий rollout второго релиза при трёх быстрых подряд.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install: false
      - env:
          STACK_BOT_APP_ID: ${{ secrets.STACK_BOT_APP_ID }}
          STACK_BOT_PRIVATE_KEY: ${{ secrets.STACK_BOT_PRIVATE_KEY }}
          CONSUMERS: ${{ secrets.STACK_CONSUMERS }}
          # Имя тега (`v1.2.3`), не голая версия: scripts/rollout.ts сам срезает префикс и
          # валидирует semver — см. его stripTagPrefix и docs/release.md, «VERSION arrives with the tag prefix».
          VERSION: ${{ github.event.workflow_run.head_branch }}
        run: bun scripts/rollout.ts
