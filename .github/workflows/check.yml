name: stack check
on:
  workflow_call:
    inputs:
      install:
        description: есть ли pnpm-воркспейс — запускать pnpm exec, а не bunx
        type: boolean
        default: true
      version:
        description: версия @alxwlw/stack для репозиториев без pnpm
        type: string
        default: latest
      gitleaks:
        description: сканировать всю историю gitleaks (конфиг .gitleaks.toml, посеянный `stack sync` → канон → default)
        type: boolean
        default: false
      registry:
        description: хост приватного npm-реестра без схемы (пусто — реестр не подключается)
        type: string
        default: ''
    secrets:
      registry-token:
        description: токен чтения приватного реестра; нужен вместе с входом registry
        required: false
jobs:
  check:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    env:
      # Значение не печатается и не пишется в ~/.npmrc: setup кладёт туда ссылку ${STACK_REGISTRY_TOKEN}.
      STACK_REGISTRY_TOKEN: ${{ secrets.registry-token }}
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks нужна вся история; строки, а не числа: `0 || 1` в выражениях дало бы 1.
          fetch-depth: ${{ inputs.gitleaks && '0' || '1' }}
      - uses: alxwlw/stack/.github/actions/setup@v1
        with:
          install: ${{ inputs.install }}
          registry: ${{ inputs.registry }}
          registry-token-var: ${{ inputs.registry != '' && 'STACK_REGISTRY_TOKEN' || '' }}
      - if: inputs.install
        run: pnpm exec stack check
      - if: ${{ !inputs.install }}
        env:
          VERSION: ${{ inputs.version }}
        run: bunx "@alxwlw/stack@$VERSION" check
      - if: inputs.gitleaks
        run: gitleaks git --redact --no-banner .
