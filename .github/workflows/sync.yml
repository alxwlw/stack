name: stack sync
on:
  workflow_call:
    inputs:
      version:
        description: версия @alxwlw/stack, которую нужно применить
        type: string
        required: true
      install:
        description: 'устарел: его передают копии канон-файла до 1.12.0 (из STACK_SYNC_INSTALL); false — то же, что --no-install; ставить ли тулчейн и зависимости, решает корневой package.json'
        type: boolean
        default: true
      base:
        description: базовая ветка PR (пусто — ветка по умолчанию репозитория)
        type: string
        default: ''
      registry:
        description: хост приватного npm-реестра без схемы (пусто — реестр не подключается)
        type: string
        default: ''
    secrets:
      app-id:
        description: ID GitHub App, от имени которого коммитится и открывается PR
        required: true
      app-private-key:
        description: приватный ключ той же GitHub App
        required: true
      registry-token:
        description: токен чтения приватного реестра; нужен вместе с входом registry
        required: false
jobs:
  sync:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    env:
      # Значение не печатается и не пишется в ~/.npmrc: setup кладёт туда ссылку ${STACK_REGISTRY_TOKEN}.
      STACK_REGISTRY_TOKEN: ${{ secrets.registry-token }}
    # Конкурентный workflow_dispatch на ту же версию может открыть два PR на одну ветку
    # stack/v<version>; последующий запуск ждёт предыдущий, а не гонится с ним.
    concurrency:
      group: stack-sync-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.base }}
      - uses: alxwlw/stack/.github/actions/setup@v1
        with:
          install: false
          registry: ${{ inputs.registry }}
          registry-token-var: ${{ inputs.registry != '' && 'STACK_REGISTRY_TOKEN' || '' }}
      # Основное ожидание — в job publish: он зелёный, только когда все версии видны в реестре, и
      # rollout зовёт sync после этого. Здесь короткая страховка от отставания CDN у раннера
      # потребителя (в 1.6.0 все sync упали в bunx на «No version matching»). Ждём только stack: без
      # него bunx не стартует. @alxwlw/*-записи каталога dev ждёт сама команда (SYNC_PR_WAIT в
      # packages/stack/src/sync-pr.ts) тем же числом попыток.
      # Опрашиваем ту же abbreviated-запись (URL и Accept), которую следом запросит bunx.
      - name: дождаться версии в npm
        env:
          VERSION: ${{ inputs.version }}
          ATTEMPTS: '12'
          INTERVAL: '10'
        run: |
          accept='application/vnd.npm.install-v1+json; q=1.0, application/json; q=0.8, */*'
          for i in $(seq 1 "$ATTEMPTS"); do
            if curl -fsS -H "Accept: $accept" "https://registry.npmjs.org/@alxwlw%2fstack" |
              node -e 'const d = JSON.parse(require("fs").readFileSync(0, "utf8")); process.exit(d.versions?.[process.env.VERSION] ? 0 : 1)'; then
              echo "@alxwlw/stack@$VERSION есть в реестре"
              exit 0
            fi
            if [ "$i" -lt "$ATTEMPTS" ]; then sleep "$INTERVAL"; fi
          done
          echo "::error::за $ATTEMPTS попыток в реестре не появилась версия @alxwlw/stack@$VERSION"
          exit 1
      # Команда — пакета той же версии (>= 1.11.0, первый релиз с sync-pr); dispatch более старой версии
      # падает на unknown command "sync-pr" с кодом 2 — так задумано. INSTALL приходит только от копий
      # канон-файла до 1.12.0. GH_TOKEN команда не передаёт ни git, ни proto, ни pnpm.
      - name: открыть sync-PR
        env:
          VERSION: ${{ inputs.version }}
          BASE: ${{ inputs.base }}
          INSTALL: ${{ inputs.install }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STACK_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          args=(sync-pr "--base=$BASE")
          if [ "$INSTALL" = false ]; then args+=(--no-install); fi
          bunx "@alxwlw/stack@$VERSION" "${args[@]}"
