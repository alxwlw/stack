name: stack sync
on:
  workflow_call:
    inputs:
      version:
        description: версия @alxwlw/stack, которую нужно применить
        type: string
        required: true
      install:
        description: 'запускать ли pnpm install после sync (false для приватных реестров)'
        type: boolean
        default: true
      base:
        description: базовая ветка PR (пусто — ветка по умолчанию репозитория)
        type: string
        default: ''
    secrets:
      app-id:
        description: ID GitHub App, от имени которого коммитится и открывается PR
        required: true
      app-private-key:
        description: приватный ключ той же GitHub App
        required: true
jobs:
  sync:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # Конкурентный workflow_dispatch на ту же версию может открыть два PR на одну ветку
    # stack/v<version>; последующий запуск ждёт предыдущий, а не гонится с ним.
    concurrency:
      group: stack-sync-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.base }}
      - uses: alxwlw/stack/.github/actions/setup@v1
        with:
          install: false
      # rollout зовёт sync сразу после publish, а реестр отдаёт новую версию не сразу: в 1.6.0
      # все sync упали в bunx на «No version matching». Ждём все lockstep-пакеты, не только
      # stack: sync поднимает @alxwlw/* в каталоге, и в 1.7.0 pnpm install упал на tsconfig,
      # которую publish выложил позже stack. Опрашиваем ту же abbreviated-запись (URL и Accept),
      # которую следом запросят bunx и pnpm.
      - name: дождаться версии в npm
        env:
          VERSION: ${{ inputs.version }}
          PACKAGES: stack oxlint-config tsconfig repo-rules
          ATTEMPTS: '60'
          INTERVAL: '10'
        run: |
          accept='application/vnd.npm.install-v1+json; q=1.0, application/json; q=0.8, */*'
          pending="$PACKAGES"
          for i in $(seq 1 "$ATTEMPTS"); do
            left=''
            for p in $pending; do
              if curl -fsS -H "Accept: $accept" "https://registry.npmjs.org/@alxwlw%2f$p" |
                node -e 'const d = JSON.parse(require("fs").readFileSync(0, "utf8")); process.exit(d.versions?.[process.env.VERSION] ? 0 : 1)'; then
                echo "@alxwlw/$p@$VERSION есть в реестре"
              else
                left="$left $p"
              fi
            done
            pending="$left"
            if [ -z "$pending" ]; then exit 0; fi
            if [ "$i" -lt "$ATTEMPTS" ]; then sleep "$INTERVAL"; fi
          done
          echo "::error::за $ATTEMPTS попыток в реестре не появилась версия $VERSION:$pending"
          exit 1
      - env:
          VERSION: ${{ inputs.version }}
        run: bunx "@alxwlw/stack@$VERSION" sync
      # sync мог поднять пины в .prototools: setup ставил тулчейн по старым, а шим proto
      # отказывается запускать pnpm, пока новая версия не установлена (missing_tool).
      - if: inputs.install
        run: proto install
      - if: inputs.install
        run: pnpm install --no-frozen-lockfile
      - name: проверить, есть ли изменения
        id: diff
        run: |
          changed="$(git status --porcelain | cut -c4-)"
          if [ -z "$changed" ]; then
            echo "канон уже применён, менять нечего"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "files<<STACK_SYNC_FILES"
            echo "$changed"
            echo "STACK_SYNC_FILES"
          } >> "$GITHUB_OUTPUT"
      - name: узнать пользователя бота
        if: steps.diff.outputs.changed == 'true'
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      - name: закоммитить и запушить ветку
        if: steps.diff.outputs.changed == 'true'
        env:
          VERSION: ${{ inputs.version }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.bot-user.outputs.id }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -B "stack/v${VERSION}"
          git add -A
          git commit -m "chore(stack): канон ${VERSION}"
          git push --force origin "stack/v${VERSION}"
      - name: открыть pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
          BASE: ${{ inputs.base }}
        run: |
          {
            echo "Канон \`@alxwlw/stack@${VERSION}\` применён к репозиторию."
            echo
            echo "Изменённые файлы:"
            while IFS= read -r file; do
              printf -- '- %s\n' "$file"
            done <<<"$CHANGED_FILES"
            echo
            echo "Релиз: https://github.com/alxwlw/stack/releases/tag/v${VERSION}"
          } >"$RUNNER_TEMP/stack-sync-pr-body.md"
          if [ "$(gh pr list --head "stack/v${VERSION}" --json number --jq length)" = "0" ]; then
            gh pr create \
              --title "chore(stack): канон ${VERSION}" \
              --body-file "$RUNNER_TEMP/stack-sync-pr-body.md" \
              --head "stack/v${VERSION}" \
              ${BASE:+--base "$BASE"}
          else
            echo "PR для stack/v${VERSION} уже открыт, ветка обновлена force-push"
          fi
