name: stack sync
on:
  workflow_call:
    inputs:
      version:
        description: версия @alxwlw/stack, которую нужно применить
        type: string
        required: true
      install:
        description: 'устарел: его передают копии канон-файла до 1.12.0 (из STACK_SYNC_INSTALL); false — то же, что --no-install; ставить ли тулчейн и зависимости, решает корневой package.json'
        type: boolean
        default: true
      base:
        description: базовая ветка PR (пусто — ветка по умолчанию репозитория)
        type: string
        default: ''
      registry:
        description: хост приватного npm-реестра без схемы (пусто — реестр не подключается)
        type: string
        default: ''
    secrets:
      app-id:
        description: ID GitHub App, от имени которого коммитится и открывается PR
        required: true
      app-private-key:
        description: приватный ключ той же GitHub App
        required: true
      registry-token:
        description: токен чтения приватного реестра; нужен вместе с входом registry
        required: false
jobs:
  sync:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    env:
      # Значение не печатается и не пишется на диск: setup по умолчанию берёт эту переменную и кладёт в npmrc джоба ссылку ${STACK_REGISTRY_TOKEN}.
      STACK_REGISTRY_TOKEN: ${{ secrets.registry-token }}
    # Конкурентный workflow_dispatch на ту же версию может открыть два PR на одну ветку
    # stack/v<version>; последующий запуск ждёт предыдущий, а не гонится с ним.
    concurrency:
      group: stack-sync-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.base }}
      - uses: alxwlw/stack/.github/actions/setup@v1
        with:
          install: false
          registry: ${{ inputs.registry }}
      # Основное ожидание — в job publish: он зелёный, только когда все версии есть в реестре и их tarball отдаётся, и
      # rollout зовёт sync после этого. Здесь короткая страховка от отставания CDN у раннера
      # потребителя (в 1.6.0 все sync упали в bunx на «No version matching»). Ждём то, что bunx
      # ставит до старта команды: stack и каждую зависимость @alxwlw/* из versions[VERSION].dependencies
      # его же packument (свой пакет, например repo-rules), версия — значение зависимости. Источник
      # списка — манифест stack, шаг его не дублирует. Версия stack без таких зависимостей ждёт один
      # stack. @alxwlw/*-записи каталога dev ждёт сама команда (SYNC_PR_WAIT в
      # packages/stack/src/sync-pr.ts) тем же числом попыток.
      # Опрашиваем ту же abbreviated-запись (URL и Accept), которую следом запросит bunx. Версия в
      # packument ещё не значит, что tarball отдаётся (rollout 1.12.0: tarball 404 при видимом
      # packument), поэтому ждём и tarball: HEAD на dist.tarball из packument, тот URL, который
      # следом скачает bunx. В ::error:: идёт пакет, которого не дождались, и причина последней попытки.
      - name: дождаться версии в npm
        env:
          VERSION: ${{ inputs.version }}
          ATTEMPTS: '12'
          INTERVAL: '10'
        run: |
          accept='application/vnd.npm.install-v1+json; q=1.0, application/json; q=0.8, */*'
          # check <пакет> <версия>: в doc — packument, в why — причина отказа.
          check() {
            local url
            if ! doc=$(curl -fsS --max-time 30 -H "Accept: $accept" "https://registry.npmjs.org/${1/\//%2f}"); then
              why='реестр не ответил'
            elif ! url=$(printf '%s' "$doc" | node -e 'const t = JSON.parse(require("fs").readFileSync(0, "utf8")).versions?.[process.argv[1]]?.dist?.tarball; if (typeof t !== "string") process.exit(1); console.log(t)' "$2"); then
              why='нет в packument'
            elif ! curl -fsS --max-time 30 -I "$url" >/dev/null; then
              why='в packument есть, tarball не отдаётся'
            else
              echo "$1@$2 есть в реестре, tarball отдаётся"
              return 0
            fi
            return 1
          }
          for i in $(seq 1 "$ATTEMPTS"); do
            target="@alxwlw/stack@$VERSION"
            if check "@alxwlw/stack" "$VERSION"; then
              deps=$(printf '%s' "$doc" | node -e 'const d = JSON.parse(require("fs").readFileSync(0, "utf8")).versions?.[process.env.VERSION]?.dependencies ?? {}; for (const [n, v] of Object.entries(d)) if (n.startsWith("@alxwlw/") && typeof v === "string") console.log(n + " " + v)')
              missing=0
              while read -r name ver; do
                [ -n "$name" ] || continue
                if ! check "$name" "$ver"; then target="$name@$ver"; missing=1; break; fi
              done <<< "$deps"
              if [ "$missing" = 0 ]; then exit 0; fi
            fi
            if [ "$i" -lt "$ATTEMPTS" ]; then sleep "$INTERVAL"; fi
          done
          echo "::error::за $ATTEMPTS попыток в реестре не появилась версия $target ($why)"
          exit 1
      # Команда — пакета той же версии (>= 1.11.0, первый релиз с sync-pr); dispatch более старой версии
      # падает с ошибкой использования (код 2: версии до 1.11.0 не знают --base) — так задумано. INSTALL приходит только от копий
      # канон-файла до 1.12.0. GH_TOKEN команда не передаёт ни git, ни proto, ни pnpm.
      - name: открыть sync-PR
        env:
          VERSION: ${{ inputs.version }}
          BASE: ${{ inputs.base }}
          INSTALL: ${{ inputs.install }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STACK_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          args=(sync-pr "--base=$BASE")
          if [ "$INSTALL" = false ]; then args+=(--no-install); fi
          bunx "@alxwlw/stack@$VERSION" "${args[@]}"
