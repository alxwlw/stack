name: publish
on:
  push:
    # Только semver-подобные теги (vX.Y.Z[-...]) — плавающий мажор `v1` (см. docs/release.md, «Move the floating v1 tag»)
    # тоже подошёл бы под `v*` и гонял бы этот воркфлоу второй раз на уже опубликованной версии.
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
  id-token: write
jobs:
  selftest:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun test
      - run: pnpm exec oxlint --type-aware
      - run: pnpm exec oxfmt --check .
      - run: pnpm exec tsc --build
      - name: версия тега совпадает с версией каждого пакета
        run: bun scripts/release.ts check-tag "$GITHUB_REF_NAME"
  publish:
    needs: selftest
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: |
          # Раннер приносит npm 10.x от ноды своего образа, а proto пинит ноду, но npm не шимит.
          # Установить свежий npm мало: `npm --version` после `npm i -g` продолжает отдавать старый,
          # потому что PATH указывает не туда, куда лёг новый пакет (проверено на прогоне 1.0.1).
          # Поэтому обращаемся к установленному CLI по абсолютному пути и им же публикуем — PATH
          # в этой джобе не участвует вовсе.
          npm i -g npm@^11.5
          NPM="$(npm root -g)/npm/bin/npm-cli.js"
          [ -f "$NPM" ] || { echo "не нашёл npm-cli.js по пути $NPM"; exit 1; }

          v=$(node "$NPM" --version)
          major="${v%%.*}"
          minor="${v#*.}"
          minor="${minor%%.*}"
          if [ "$major" -lt 11 ] || { [ "$major" -eq 11 ] && [ "$minor" -lt 5 ]; }; then
            echo "npm $v < 11.5.1 — OIDC trusted publishing не сработает"
            exit 1
          fi
          echo "npm $v ok"

          # Пакеты, пропуск уже выложенных версий и ожидание реестра — в scripts/release.ts: список
          # не живёт в YAML. Job зелёный, только когда все версии видны в реестре, и rollout.yml
          # (workflow_run на publish) рассылает sync уже после этого. Если реестр не ответил на
          # проверку «уже выложено», job падает с именем пакета; перезапуск безопасен, выложенное
          # пропускается.
          NPM="$NPM" bun scripts/release.ts publish
