name: renovate
on:
  workflow_call:
    inputs:
      log-level:
        description: уровень лога Renovate — info или debug
        type: string
        default: info
      registry:
        description: хост приватного npm-реестра без схемы (пусто — реестр не подключается)
        type: string
        default: ''
    secrets:
      token:
        description: токен, от имени которого Renovate клонирует репо и открывает PR
        required: true
      registry-token:
        description: токен чтения приватного реестра; нужен вместе с входом registry
        required: false
permissions:
  contents: read
jobs:
  renovate:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # cron и ручной запуск на один репо гонялись бы за одни ветки.
    concurrency:
      group: renovate-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # Без checkout: action запускает образ renovate/renovate, тот сам клонирует репо по токену
      # и читает его конфиг. Полная версия: плавающего @v46 у action нет.
      - uses: renovatebot/github-action@v46.3.13
        with:
          token: ${{ secrets.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ inputs.log-level }}
          # Host rule приватного реестра только при непустом registry; иначе пустой список.
          RENOVATE_HOST_RULES: ${{ inputs.registry != '' && format('[{{"matchHost":"{0}","hostType":"npm","token":"{1}"}}]', inputs.registry, secrets.registry-token) || '[]' }}
