name: renovate (self)
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      log-level:
        type: choice
        options: [info, debug]
        default: info
# GITHUB_TOKEN не нужен (Renovate идёт под токеном GitHub App), но renovate.yml просит contents: read, а права
# вызывающего — потолок вызываемого: с меньшими workflow недействителен.
permissions:
  contents: read
# Группа уникальна на прогон: очередь держит джоб вызываемого (renovate-<репозиторий>); та же группа дала бы тупик.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  renovate:
    uses: ./.github/workflows/renovate.yml
    with:
      log-level: ${{ inputs.log-level || 'info' }}
    secrets:
      app-id: ${{ secrets.RENOVATE_APP_ID }}
      app-private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
