# Canon file — sync-managed: edits happen in alxwlw/stack, not here.
# Needs a GitHub App: secrets RENOVATE_APP_ID and RENOVATE_APP_PRIVATE_KEY. App permissions: Repository: Checks, Commit
# statuses, Contents, Issues, Pull requests, Workflows — read and write; Administration, Dependabot alerts, Metadata — read;
# Organization: Members — read. There is no PAT fallback: without the App the run fails.
# Optional: STACK_REGISTRY variable + STACK_REGISTRY_TOKEN secret for a private npm registry.
name: renovate
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      log-level:
        type: choice
        options: [info, debug]
        default: info
# Сам файл токен не берёт (Renovate работает под токеном GitHub App), но renovate.yml@v1 просит contents: read,
# а права вызывающего — потолок вызываемого: с {} workflow недействителен целиком.
permissions:
  contents: read
# Группа уникальна на прогон: очередь держит джоб renovate вызываемого (renovate-<репозиторий>, без отмены).
# Та же группа у вызывающего и вызываемого дала бы тупик.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  renovate:
    uses: alxwlw/stack/.github/workflows/renovate.yml@v1
    with:
      log-level: ${{ inputs.log-level || 'info' }}
      registry: ${{ vars.STACK_REGISTRY || '' }}
    secrets:
      app-id: ${{ secrets.RENOVATE_APP_ID }}
      app-private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      registry-token: ${{ secrets.STACK_REGISTRY_TOKEN }}
