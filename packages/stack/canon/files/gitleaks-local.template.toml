# Repo-local gitleaks config — YOURS to edit (seeded once by `stack sync`,
# never overwritten). The canon ruleset lives in .gitleaks.canon.toml, which IS
# sync-managed verbatim — never edit that file; put repo-specific allowlists
# and extra rules HERE instead. gitleaks chains configs via [extend]:
# default ruleset → .gitleaks.canon.toml → this file.
[extend]
path = ".gitleaks.canon.toml"

# Example repo-local allowlist:
# [[allowlists]]
# description = "test fixtures with fake keys"
# paths = ['''tests/fixtures/.*''']
