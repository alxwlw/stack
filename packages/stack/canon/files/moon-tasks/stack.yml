$schema: 'https://moonrepo.dev/schemas/tasks.json'

# Canon template (seeded once via --with=moon-tasks; repo-owned afterwards).
# `stack check` reads .stack.jsonc; no git hook is imposed — wire this task
# into your own pre-commit/CI as you see fit.
#
# Every project inherits this task, and .stack.jsonc lives at the workspace root:
# the task runs from the root, through `pnpm exec` (a project without package.json
# has no node_modules/.bin on its PATH), with workspace-relative inputs.
# `moon run <project>:stack-check` checks the repo once; `moon run :stack-check`
# repeats the same check for every project.

tasks:
  stack-check:
    command: 'pnpm exec stack check'
    inputs:
      - '/.stack.jsonc'
      - '/.prototools'
      - '/pnpm-workspace.yaml'
    options:
      cache: false
      runFromWorkspaceRoot: true
